[workspace]
members = [
  "crates/skilld-auth",
  "crates/skilld-command",
  "crates/skilld-core",
  "crates/skilld-native",
  "crates/skilld-ui",
]
resolver = "3"

[workspace.package]
version = "3.6.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/skilld-dev/skilld"
rust-version = "1.88"

[workspace.dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = [ "derive" ] }
ed25519-dalek = "3.0.0"
fs4 = "1.1.0"
gethostname = "1.1.0"
getrandom = "0.4.3"
keyring = { version = "4.2.0", default-features = false, features = [ "v1" ] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
sha2 = "0.11.0"
skilld-auth = { path = "crates/skilld-auth" }
skilld-command = { path = "crates/skilld-command" }
skilld-core = { path = "crates/skilld-core" }
skilld-ui = { path = "crates/skilld-ui" }
subtle = "2.6.1"
tempfile = "3.27.0"
terminal_size = "0.4.4"
unicode-width = "=0.2.2"
url = "2.5.8"
zeroize = "1.9.0"

[profile.release]
# Size over speed. npx and the install script download this binary before
# the first run, and a run spends its time on the network. Measured on linux
# x64 on 2026-10-07: the binary fell from 10.1 MB to 6.6 MB, and its npm
# package from 4.5 MB to 3.1 MB.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
