[workspace]
members = [
  "crates/skilld-command",
  "crates/skilld-core",
  "crates/skilld-native",
  "crates/skilld-wasi",
]
resolver = "3"

[workspace.package]
version = "3.0.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/skilld-dev/skilld"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.6.6", features = [ "derive" ] }
fs4 = "1.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
skilld-command = { path = "crates/skilld-command" }
skilld-core = { path = "crates/skilld-core" }
tempfile = "3.27.0"
wit-bindgen = "0.60.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
