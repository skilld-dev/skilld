[workspace]
members = [
  "crates/skilld-auth",
  "crates/skilld-command",
  "crates/skilld-core",
  "crates/skilld-native",
  "crates/skilld-wasi",
]
resolver = "3"

[workspace.package]
version = "3.0.0-beta.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/skilld-dev/skilld"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22.1"
clap = { version = "4.6.6", features = [ "derive" ] }
fs4 = "1.1.0"
getrandom = "0.3.4"
keyring = "3.6.3"
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
sha2 = "0.11.0"
skilld-auth = { path = "crates/skilld-auth" }
skilld-command = { path = "crates/skilld-command" }
skilld-core = { path = "crates/skilld-core" }
subtle = "2.6.1"
tempfile = "3.27.0"
url = "2.5.8"
wit-bindgen = "0.60.0"
zeroize = "1.9.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
