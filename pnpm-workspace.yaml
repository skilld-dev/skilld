catalogMode: prefer
minimumReleaseAgeExclude:
  - verkit@0.2.0
  - '@mdream/rust-wasm32-wasi@1.5.12'
  - retriv@0.15.0
shellEmulator: true

trustPolicy: no-downgrade
packages:
  - playground
  - packages/*
overrides:
  global-agent: ^4.1.3
catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@earendil-works/pi-ai': ^0.84.1
  '@mdream/crawl': ^1.6.1
  '@napi-rs/keyring': ^1.3.0
  '@typescript/native': npm:typescript@7.0.2
  bumpp: ^12.2.0
  giget: ^3.3.1
  hookable: ^6.1.1
  jsonc-parser: ^3.3.1
  mdream: ^1.6.1
  ofetch: ^1.5.1
  pathe: ^2.0.3
  publint: ^0.3.23
  retriv: ^0.15.0
  std-env: ^4.2.0
  tsx: ^4.23.12
  typebox: ^1.3.12
  typescript: npm:@typescript/typescript6@^6.0.2
  unagent: ^0.0.8
  verkit: ^0.3.2
  zod: ^4.4.3
catalogs:
  deps:
    '@clack/prompts': ^1.7.0
    '@huggingface/transformers': ^4.2.0
    citty: ^0.2.2
    consola: ^3.4.2
    log-update: ^8.0.0
    oxc-parser: ^0.144.0
    p-limit: ^7.3.1
    sqlite-vec: ^0.1.9
  dev-build:
    '@types/node': ^26.2.0
    obuild: ^0.4.38
  dev-lint:
    '@antfu/eslint-config': ^9.3.0
    eslint: ^10.8.1
  dev-test:
    '@vitest/coverage-v8': ^4.1.10
    vitest: ^4.1.10

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  '@google/genai': false
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
