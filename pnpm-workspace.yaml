  '@ai-sdk/provider-utils': ^5.0.28
  '@arethetypeswrong/cli': ^0.18.5
  '@redocly/cli': ^2.46.2
  '@typescript/native': npm:typescript@7.0.2
  openapi-typescript: ^7.13.0
  publint: ^0.3.23
