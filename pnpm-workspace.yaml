catalogMode: prefer
minimumReleaseAgeExclude:
  - verkit@0.2.0
shellEmulator: true

trustPolicy: no-downgrade
packages:
  - playground
  - packages/*
overrides:
  global-agent: ^4.1.3
catalog:
  '@arethetypeswrong/cli': ^0.18.2
  '@earendil-works/pi-ai': ^0.76.0
  '@mdream/crawl': ^1.2.2
  bumpp: ^11.1.0
  giget: ^3.2.0
  hookable: ^6.1.1
  jsonc-parser: ^3.3.1
  md4x: ^0.0.25
  mdream: ^1.2.2
  ofetch: ^1.5.1
  pathe: ^2.0.3
  publint: ^0.3.21
  retriv: ^0.14.7
  std-env: ^4.1.0
  tsx: ^4.22.3
  typebox: ^1.1.38
  typescript: 6.0.3
  unagent: ^0.0.8
  verkit: ^0.2.0
  zod: ^4.4.3
catalogs:
  deps:
    '@clack/prompts': ^1.4.0
    '@huggingface/transformers': ^4.2.0
    citty: ^0.2.2
    consola: ^3.4.2
    log-update: ^8.0.0
    oxc-parser: ^0.133.0
    p-limit: ^7.3.0
    sqlite-vec: ^0.1.9
  dev-build:
    '@types/node': ^25.9.1
    obuild: ^0.4.36
  dev-lint:
    '@antfu/eslint-config': ^9.0.0
    eslint: ^10.4.0
  dev-test:
    '@vitest/coverage-v8': ^4.1.7
    vitest: ^4.1.7

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  '@google/genai': false
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
