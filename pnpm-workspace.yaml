  yaml: ^2.9.0
  zod: ^4.4.3
catalogs:
  dev-build:
    '@types/node': ^26.2.0
    obuild: ^0.4.38
  dev-lint:
    '@antfu/eslint-config': ^9.3.0
    eslint: ^10.8.1
  dev-test:
    vitest: ^4.1.10

onlyBuiltDependencies:
