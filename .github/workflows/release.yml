name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  SKILLD_ROOT_KEY_ID: ${{ vars.SKILLD_ROOT_KEY_ID }}
  SKILLD_ROOT_PUBLIC_KEY: ${{ vars.SKILLD_ROOT_PUBLIC_KEY }}
  SKILLD_BACKUP_ROOT_KEY_ID: ${{ vars.SKILLD_BACKUP_ROOT_KEY_ID }}
  SKILLD_BACKUP_ROOT_PUBLIC_KEY: ${{ vars.SKILLD_BACKUP_ROOT_PUBLIC_KEY }}
  SKILLD_RELEASE_PUBLIC_KEY: ${{ vars.SKILLD_RELEASE_PUBLIC_KEY }}

jobs:
  release-plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Require the trusted roots
        shell: bash
        run: |
          # Root key ids use only unreserved URL characters, so a URL path
          # holds them without encoding.
          id_pattern='^[A-Za-z0-9._~-]{1,100}$'
          # 32 bytes in canonical unpadded base64url: 43 characters, and the
          # last one leaves its two padding bits unset.
          key_pattern='^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
          for root in SKILLD_ROOT SKILLD_BACKUP_ROOT; do
            key_id_name="${root}_KEY_ID"
            public_key_name="${root}_PUBLIC_KEY"
            key_id="${!key_id_name}"
            public_key="${!public_key_name}"
            if [[ ! $key_id =~ $id_pattern || $key_id == . || $key_id == .. ]]; then
              echo "$key_id_name must be 1 to 100 characters from A-Z, a-z, 0-9, '.', '_', '~', and '-'." >&2
              exit 1
            fi
            if [[ $key_id == skilld-root-2026 ]]; then
              echo "$key_id_name names skilld-root-2026. Its private key is lost." >&2
              exit 1
            fi
            if [[ ! $public_key =~ $key_pattern ]]; then
              echo "$public_key_name must be a 32-byte Ed25519 public key in canonical unpadded base64url." >&2
              exit 1
            fi
          done
          if [[ $SKILLD_BACKUP_ROOT_KEY_ID == "$SKILLD_ROOT_KEY_ID" \
            || $SKILLD_BACKUP_ROOT_PUBLIC_KEY == "$SKILLD_ROOT_PUBLIC_KEY" ]]; then
            echo 'The backup root must have its own key id and public key.' >&2
            exit 1
          fi
          test -n "$SKILLD_RELEASE_PUBLIC_KEY" || {
            echo 'SKILLD_RELEASE_PUBLIC_KEY is required. Run node scripts/release/release-signing.mjs generate-key.' >&2
            exit 1
          }
      - name: Require skilld.dev to serve both pinned roots
        timeout-minutes: 5
        shell: bash
        run: |
          probe="$(mktemp -d)"
          trap 'rm -rf "$probe"' EXIT
          # Resolve this release's public Skill through the deployed service.
          # Both roots must verify the same attestation before any native build.
          jq -n --arg commit "$GITHUB_SHA" \
            '{source: {provider: "github", owner: "skilld-dev", repository: "skilld",
              selector: {type: "path", path: "skills/skilld"}, ref: {type: "commit", value: $commit}}}' \
            > "$probe/request.json"
          status="$(curl --fail --silent --show-error --proto '=https' --max-time 30 \
            --output "$probe/resolution.json" --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --header 'Skilld-Capabilities: linked-files' \
            --header "Idempotency-Key: release-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --data-binary "@$probe/request.json" 'https://skilld.dev/api/v1/resolutions')"
          [[ $status == 200 || $status == 202 ]]
          resolution_id="$(jq -er '.resolutionId | select(test("^[A-Za-z0-9_-]{1,100}$"))' "$probe/resolution.json")"
          for attempt in {1..60}; do
            state="$(jq -er --arg id "$resolution_id" 'select(.resolutionId == $id) | .state' "$probe/resolution.json")"
            if [[ $state == ready ]]; then
              break
            fi
            [[ $state == pending ]]
            sleep 2
            status="$(curl --fail --silent --show-error --proto '=https' --max-time 30 \
              --output "$probe/resolution.json" --write-out '%{http_code}' \
              "https://skilld.dev/api/v1/resolutions/$resolution_id")"
            [[ $status == 200 ]]
          done
          jq -e --arg commit "$GITHUB_SHA" --arg id "$resolution_id" \
            'select(.state == "ready" and .resolutionId == $id)
              | .artifact | select(.visibility == "public" and .artifactId == .attestation.artifactId)
              | .attestation | select(.source.owner == "skilld-dev" and .source.repository == "skilld"
                and .source.skillPath == "skills/skilld" and .source.commitSha == $commit
                and .source.visibility == "public")' \
            "$probe/resolution.json" > "$probe/attestation.json"
          # The CLI asks for each pinned root by its id. A root that skilld.dev
          # does not serve leaves the release with one root or none.
          require_served_root() (
            local key_id_name="$1" public_key_name="$2"
            local key_id="${!key_id_name}" public_key="${!public_key_name}"
            local body status
            body="$(mktemp)"
            trap 'rm -f "$body"' EXIT
            # No --location: a redirect fails this check.
            status="$(curl --fail --silent --show-error --proto '=https' \
              --retry 3 --max-time 30 --output "$body" --write-out '%{http_code}' \
              "https://skilld.dev/api/v1/trusted-roots/$key_id")" || {
              echo "skilld.dev does not serve the trusted root $key_id from $key_id_name." >&2
              exit 1
            }
            if [[ $status != 200 ]]; then
              echo "skilld.dev answered HTTP $status for the trusted root $key_id from $key_id_name." >&2
              exit 1
            fi
            cargo run --locked --quiet --package skilld-core --example verify-release-root \
              -- "$body" "$key_id" "$public_key" "$probe/attestation.json"
          )
          require_served_root SKILLD_ROOT_KEY_ID SKILLD_ROOT_PUBLIC_KEY
          require_served_root SKILLD_BACKUP_ROOT_KEY_ID SKILLD_BACKUP_ROOT_PUBLIC_KEY
      - id: matrix
        name: Read native package matrix
        shell: bash
        run: |
          node scripts/release/native-packages.mjs versions "$GITHUB_REF_NAME"
          echo "value=$(node scripts/release/native-packages.mjs matrix)" >> "$GITHUB_OUTPUT"

  build-native:
    needs: release-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.libc == 'musl'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build native CLI
        run: cargo build --locked --release --package skilld-native --target ${{ matrix.target }}
        env:
          CFLAGS: ${{ matrix.cflags }}
      - name: Stage native CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          install -d "staging/${{ matrix.directory }}/bin"
          install -m 755 \
            "target/${{ matrix.target }}/release/${{ matrix.executable }}" \
            "staging/${{ matrix.directory }}/bin/${{ matrix.executable }}"
          "staging/${{ matrix.directory }}/bin/${{ matrix.executable }}" --version
          tar -cf "${{ matrix.directory }}.tar" -C staging "${{ matrix.directory }}"
      - name: Stage native CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = "staging/${{ matrix.directory }}/bin/${{ matrix.executable }}"
          New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" $destination
          & $destination --version
          tar -cf "${{ matrix.directory }}.tar" -C staging "${{ matrix.directory }}"
      - uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: ${{ matrix.directory }}
          path: ${{ matrix.directory }}.tar

  publish:
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          path: native-artifacts
      - name: Restore native packages
        shell: bash
        run: |
          while IFS= read -r archive; do
            tar -xf "$archive" -C packages
          done < <(find native-artifacts -type f -name '*.tar' | sort)
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:run
      - id: npm_tag
        name: Resolve shared npm tag
        shell: bash
        run: echo "value=$(node scripts/release/native-packages.mjs npm-tag)" >> "$GITHUB_OUTPUT"
      - name: Build JavaScript packages
        run: |
          pnpm --filter skilld-protocol build
          pnpm --filter skilld-harness build
      - name: Check native package artifacts
        shell: bash
        run: |
          node scripts/release/native-packages.mjs verify packages
          mkdir -p artifacts/native-packages
          while IFS= read -r directory; do
            pnpm --dir "packages/$directory" pack \
              --pack-destination "$GITHUB_WORKSPACE/artifacts/native-packages"
          done < <(node scripts/release/native-packages.mjs directories)
          node scripts/release/native-packages.mjs verify-packed artifacts/native-packages
      - name: Smoke test the installed loader
        shell: bash
        run: |
          expected="skilld $(node -p "require('./package.json').version")"
          actual="$(node bin/skilld.mjs --version)"
          if test "$actual" != "$expected"; then
            printf 'CLI version mismatch: expected %s, received %s\n' "$expected" "$actual" >&2
            exit 1
          fi
      - name: Pack the root CLI
        run: pnpm pack --pack-destination artifacts
      - name: Stage signed standalone release
        env:
          SKILLD_RELEASE_SIGNING_KEY: ${{ secrets.SKILLD_RELEASE_SIGNING_KEY }}
        run: node scripts/release/release-signing.mjs stage packages release-assets
      - name: Create draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Immutable releases reject assets after publication, so assets go on a draft first.
          if state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if test "$state" = false; then
              echo "Release $GITHUB_REF_NAME is already published and immutable. Tag a new version." >&2
              exit 1
            fi
          else
            npx changelogithub --draft
          fi
      - name: Upload standalone release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed "s/__SKILLD_RELEASE_PUBLIC_KEY__/$SKILLD_RELEASE_PUBLIC_KEY/" install.sh >release-assets/install.sh
          grep -q "RELEASE_PUBLIC_KEY=\"$SKILLD_RELEASE_PUBLIC_KEY\"" release-assets/install.sh
          find release-assets -type f -print0 \
            | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
          gh release upload "$GITHUB_REF_NAME" --clobber install.ps1
      - name: Publish native packages
        shell: bash
        run: |
          while IFS= read -r directory; do
            if test "$(node scripts/release/native-packages.mjs package-publish "packages/$directory")" = true; then
              pnpm --dir "packages/$directory" publish --access public --no-git-checks --tag "${{ steps.npm_tag.outputs.value }}"
            fi
          done < <(node scripts/release/native-packages.mjs directories)
      - name: Publish root CLI
        shell: bash
        run: |
          if test "$(node scripts/release/native-packages.mjs package-publish .)" = true; then
            pnpm publish --access public --no-git-checks --tag "${{ steps.npm_tag.outputs.value }}"
          fi
      - name: Publish Harness
        shell: bash
        run: |
          if test "$(node scripts/release/native-packages.mjs package-publish packages/harness)" = true; then
            pnpm --dir packages/harness publish --access public --no-git-checks --tag "${{ steps.npm_tag.outputs.value }}"
          fi
      - name: Wait for npm availability
        timeout-minutes: 17
        run: node --experimental-strip-types scripts/release/npm-availability.ts "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  publish-protocol:
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-skilld-protocol
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - id: protocol_release
        name: Check independent protocol version
        shell: bash
        run: |
          decision="$(node scripts/release/native-packages.mjs package-publish packages/protocol)"
          echo "publish=$decision" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Check protocol
        run: |
          pnpm --filter skilld-protocol lint
          pnpm --filter skilld-protocol typecheck
          pnpm --filter skilld-protocol test:run
          pnpm --filter skilld-protocol build
          pnpm --filter skilld-protocol publint
      - name: Publish independent protocol
        if: steps.protocol_release.outputs.publish == 'true'
        run: pnpm --dir packages/protocol publish --access public --no-git-checks --provenance

  publish-sdk:
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-skilld-sdk
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - id: sdk_release
        name: Check independent SDK version
        shell: bash
        run: |
          decision="$(node scripts/release/native-packages.mjs package-publish packages/sdk)"
          echo "publish=$decision" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Check SDK
        run: |
          pnpm exec eslint packages/sdk
          pnpm --filter skilld-sdk typecheck
          pnpm --filter skilld-sdk test:run
          pnpm --filter skilld-sdk build
          cargo test -p skilld-core --test api_contract
      - name: Publish independent SDK
        if: steps.sdk_release.outputs.publish == 'true'
        run: pnpm --dir packages/sdk publish --access public --no-git-checks --provenance
